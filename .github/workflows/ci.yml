name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"

      - name: Check module tidiness
        if: runner.os == 'Linux'
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Build
        run: go build -trimpath ./cmd/deskweaver

      - name: Binary self-check
        if: runner.os == 'Linux'
        run: go run ./cmd/deskweaver self-check

      - name: Rule self-test
        if: runner.os == 'Linux'
        run: go run ./cmd/deskweaver rules test
