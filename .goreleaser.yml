version: 2

project_name: deskweaver

before:
  hooks:
    - go mod tidy

builds:
  - id: deskweaver
    main: ./cmd/deskweaver
    binary: deskweaver
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/luel-4013/deskweaver/internal/version.Version={{ .Version }}
      - -X github.com/luel-4013/deskweaver/internal/version.Commit={{ .Commit }}
      - -X github.com/luel-4013/deskweaver/internal/version.BuildDate={{ .Date }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    wrap_in_directory: true
    files:
      - README.md
      - LICENSE
      - NOTICE

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

# CycloneDX SBOMs are produced by Syft during the release workflow.
sboms:
  - artifacts: archive
    args: ["$artifact", "--output", "cyclonedx-json=$document", "--enrich", "all"]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true
  prerelease: auto

# Signing is intentionally absent until a release key and disclosure process
# exist. Do not add placeholder signing keys: a signed-but-unverifiable release
# is worse than an honestly unsigned one.
